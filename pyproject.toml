[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "work-researcher-mcp"
version = "0.1.0"
description = "Local MCP server for UK job search, CV management and job applications"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Work Researcher MCP" }]
keywords = ["mcp", "jobs", "uk", "cv", "applications"]

dependencies = [
    "mcp>=2,<3",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "aiosqlite>=0.20,<1",
    "selectolax>=0.3.21,<1",
    "rapidfuzz>=3.9,<4",
    "python-docx>=1.1,<2",
    "pypdf>=4,<7",
    "playwright>=1.45,<2",
]

[project.scripts]
work-researcher = "work_researcher.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/work_researcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
