# Work Researcher MCP configuration.
# Copy to config.toml and edit. Secrets can also come from environment
# variables: REED_API_KEY, ADZUNA_APP_ID, ADZUNA_APP_KEY, JOOBLE_API_KEY.

[general]
cv_dir = "CV_collection"
data_dir = "data"
log_level = "INFO"

[search]
default_location = "UK"
default_radius_miles = 40
default_max_days_old = 14
default_work_from_home = false
default_limit_per_source = 25
provider_timeout_s = 30
# Drop paid training/course ads automatically (where the candidate PAYS for
# "training" — course marketing dressed as jobs). Real paid apprenticeships stay.
exclude_training_offers = true

# Saved searches: used as search_jobs(profile="..."), extendable in chat.
[search.profiles.data_analytics]
query = "Data Analyst"
alt_queries = ["Data Analytics"]
location = "UK"
max_days_old = 7

[search.profiles.field_geologist]
query = "Field Geologist"
alt_queries = ["Geologist Engineer", "Engineering Geologist", "Geotechnical Engineer"]
location = "UK"
max_days_old = 14

[applicant]
full_name = ""
email = ""
phone = ""
# Wizard answers — boards (Reed/Totaljobs apply flows) ask for these:
date_of_birth = ""                # "YYYY-MM-DD" — required by application wizards
nationality = ""
right_to_work = "Yes, I have the right to work in the UK"
right_to_work_docs = ""           # e.g. "UK passport", "UK birth certificate"
uk_residence_years = ""           # "lived in UK/EU/EEA 3+ years" question
age_group = ""                    # e.g. "25-29" (wizard dropdowns)
gender = ""
ethnicity = ""
still_in_education = false
earliest_start_date = ""          # blank = ~2 Mondays ahead
highest_qualification = ""
past_apprenticeship = false
owns_car = false
# Location intelligence: remote jobs are searched UK-wide automatically;
# on_site jobs must be within daily_commute_miles; hybrid/field/unknown
# within occasional_commute_miles. Mismatch jobs are dropped from results
# (drop_mismatch, configurable per search).
home_location = ""                # e.g. "Manchester"
home_postcode = ""                # optional, improves accuracy
max_commute_miles = 40            # legacy fallback
daily_commute_miles = 25          # on-site (daily office) commute limit
occasional_commute_miles = 50     # hybrid/field (1-2 days/week) limit
willing_to_relocate = false
relocate_areas = []               # e.g. ["Leeds", "Birmingham"]
location = ""
notice_period = ""
salary_expectation = ""
linkedin = ""

[drive]
enabled = true
# public_folder: the folder is shared "anyone with the link" — sync_cvs
# downloads anonymously, no Google credentials at all, and push_cv_to_drive
# is refused (read-only). oauth / service_account: private-folder modes with
# write support (see SETUP.md).
mode = "public_folder"
folder_url = "https://drive.google.com/drive/folders/<FOLDER-ID>"
folder_name = "CV"                 # informational label for the folder
folder_id = ""                     # alternative to folder_url: just the id
account = ""                       # your Google account (informational; unused in public_folder)
credentials_file = "secrets/google_credentials.json"   # oauth mode only
token_file = "secrets/google_token.json"               # oauth mode only
service_account_file = "secrets/google_service_account.json"  # service_account mode only

[auth]
# Pre-approved by you: the agent may click "Sign in with Google" and pick
# this account on job boards WITHOUT asking permission (2FA/captcha → ask).
google_account = ""
auto_google_signin = true

[blocklist]
# Seeded into the DB on first use; runtime additions persist in the DB via
# the manage_blocklist MCP tool ("never apply to X" → add company X here too).
companies = []

[browser]
headless = false                   # headed: user can step in for 2FA/captcha;
                                   # boards also block headless far more often
channel = "msedge"                 # real Edge: passes Windows App Control and
                                   # anti-bot; auto-falls back to bundled Chromium
default_timeout_ms = 15000

[providers.totaljobs]
enabled = true

[providers.reed]
enabled = true
api_key = ""                       # free: https://www.reed.co.uk/developers

[providers.adzuna]
enabled = true
app_id = ""                        # free: https://developer.adzuna.com
app_key = ""

[providers.jooble]
enabled = true
api_key = ""                       # free: https://jooble.org/api/about

[providers.earthworks]
enabled = true
uk_only = true

[providers.findajob]
enabled = true                     # GOV.UK Work Hub (jobs.service.gov.uk/jobs)
browser_only = true                # JS SPA — searched via browser, not HTTP
